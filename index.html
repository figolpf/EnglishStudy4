<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2ea8e8">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>译林英语</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#1f2733; --sub:#6b7686;
  --accent:#4f7cff; --accent2:#6a5af9; --accent-soft:#eaf0ff;
  --ok:#22b071; --ok-soft:#e6f7ef; --bad:#f0564a; --bad-soft:#fdeceb;
  --star:#f6a609;
  --radius:18px; --shadow:0 4px 16px rgba(31,39,51,.08);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  background:var(--bg);color:var(--ink);font-size:17px;line-height:1.5;
  overscroll-behavior-y:contain;
}
button{font-family:inherit;font-size:inherit;color:inherit;border:none;background:none;cursor:pointer}
#app{max-width:980px;margin:0 auto;min-height:100%;padding-bottom:calc(24px + var(--safe-b))}

/* ---------- 顶部栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:10px;
  padding:12px 16px;background:rgba(244,246,251,.92);backdrop-filter:blur(10px);
}
.icon-btn{
  width:42px;height:42px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;font-size:19px;flex:none;
}
.icon-btn:active{transform:scale(.94)}
.topbar h1{font-size:18px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar h1 small{display:block;font-size:12px;color:var(--sub);font-weight:400}

/* ---------- 首页 ---------- */
.hero{padding:26px 20px 8px;text-align:center}
.hero .logo{font-size:54px;line-height:1}
.hero h2{font-size:26px;font-weight:800;margin:10px 0 6px;letter-spacing:.5px}
.hero p{color:var(--sub);font-size:15px}
.book-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:22px 18px}
.book-card{
  border-radius:24px;padding:26px 18px;color:#fff;min-height:200px;
  display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:0 10px 26px rgba(31,39,51,.16);transition:transform .12s;
}
.book-card:active{transform:scale(.97)}
.book-card.a{background:linear-gradient(150deg,#5b8cff,#6a5af9)}
.book-card.b{background:linear-gradient(150deg,#ff9f43,#ee5d6c)}
.book-card.compact{min-height:132px;padding:18px 16px}
.book-card.compact .emoji{font-size:34px}
.book-card.compact h3{font-size:20px}
.book-card .emoji{font-size:46px}
.book-card .tag{font-size:12px;opacity:.85;letter-spacing:2px}
.book-card h3{font-size:23px;margin:6px 0 2px}
.book-card p{font-size:13px;opacity:.92}
.foot-note{text-align:center;color:#9aa4b4;font-size:12.5px;padding:8px 24px 0}
.foot-note b{color:var(--sub)}
.audio-sync{margin:16px 18px 0;background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:14px 16px 12px}
.audio-sync p{margin:0;font-size:14px;font-weight:700;color:var(--text)}
.audio-sync-bar{height:8px;border-radius:99px;background:#e8eef8;overflow:hidden;margin-top:10px}
.audio-sync-bar span{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#4f7cff,#6a5af9)}
.audio-sync .btn{margin-top:10px}
.audio-sync .btn[hidden]{display:none !important}
.study-sum{margin:16px 18px 0;background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:16px 16px 12px}
.study-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.study-head h3{font-size:16px;font-weight:800}
.study-live{font-size:12px;font-weight:700;color:var(--sub);background:#eef1f6;border-radius:99px;padding:3px 10px}
.study-live.on{color:#177a4f;background:var(--ok-soft)}
.study-kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.study-kpi{border-radius:16px;padding:14px 14px 12px;background:var(--accent-soft)}
.study-kpi.total{background:var(--ok-soft)}
.study-kpi .lab{font-size:13px;color:var(--sub);font-weight:700}
.study-kpi .num{font-size:24px;font-weight:900;margin-top:4px;color:var(--accent);line-height:1.2}
.study-kpi.total .num{color:#177a4f}
.study-kpi .meta{font-size:12px;color:var(--sub);margin-top:3px}
.study-days-title{margin:14px 2px 8px;font-size:13px;color:var(--sub);font-weight:700}
.study-list{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto}
.study-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 12px;border-radius:12px;background:#f5f7fc;font-size:14.5px}
.study-row .d{font-weight:700}
.study-row .t{color:var(--accent);font-weight:800;flex:none}
.study-row.today{background:var(--accent-soft)}
.study-empty{color:var(--sub);font-size:13px;padding:2px 2px 6px}
.match-entry{
  display:flex;align-items:center;gap:14px;width:calc(100% - 36px);
  margin:16px 18px 0;padding:16px 18px;border-radius:22px;text-align:left;color:#fff;
  background:linear-gradient(135deg,#22b071,#16a2c8);box-shadow:0 10px 26px rgba(22,162,200,.28)
}
.match-entry:active{transform:scale(.98)}
.match-entry .me-emoji{font-size:38px;line-height:1}
.match-entry b{display:block;font-size:18px}
.match-entry small{display:block;margin-top:2px;font-size:13px;opacity:.92}
.match-wrap{padding:0 18px 28px}
.match-sec{margin-top:16px}
.match-sec h3{font-size:14px;color:var(--sub);font-weight:700;margin-bottom:8px}
.match-picks{display:flex;flex-wrap:wrap;gap:8px}
.match-pick{
  padding:8px 12px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);
  font-weight:700;font-size:14px;color:var(--sub)
}
.match-pick.on{background:var(--accent);color:#fff}
.match-book{margin-top:12px}
.match-book .bh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.match-book .bh b{font-size:15px}
.match-meta{margin-top:14px;color:var(--sub);font-size:13.5px;font-weight:700}
.match-time{display:flex;align-items:center;gap:10px}
.match-time input{
  width:76px;text-align:center;font-size:22px;font-weight:900;color:var(--ink);
  border:none;border-radius:14px;padding:8px 6px;background:var(--card);box-shadow:var(--shadow)
}
.match-start{display:block;margin:16px auto 0;min-width:210px;justify-content:center}
.match-start[disabled]{opacity:.45}
.match-play-top{display:flex;align-items:center;gap:10px}
.match-clock{
  min-width:78px;text-align:center;font-weight:900;font-size:20px;font-variant-numeric:tabular-nums;
  background:#fff;color:var(--ink);border-radius:14px;padding:8px 10px;box-shadow:var(--shadow)
}
.match-clock.warn{color:var(--bad);background:var(--bad-soft)}
.match-board{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 0 8px}
.match-tile{
  min-height:88px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);
  padding:10px 10px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;text-align:center;line-height:1.3;font-weight:800;transition:transform .16s,opacity .16s,background .16s
}
.match-tile .mk{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--accent)}
.match-tile.zh .mk{color:#177a4f}
.match-tile.on{outline:3px solid var(--accent);background:var(--accent-soft);transform:translateY(-2px)}
.match-tile.bad{outline:3px solid var(--bad);background:var(--bad-soft)}
.match-tile.gone{opacity:0;transform:scale(.72);pointer-events:none}
.match-tip{text-align:center;color:var(--sub);font-size:13px;margin-top:8px}
.match-result{text-align:center;padding:12px 0 8px}
.match-result .big{font-size:56px;font-weight:900;color:var(--accent);line-height:1}
.match-rank{display:flex;flex-direction:column;gap:8px;margin-top:8px;text-align:left}
.match-rank .row{
  display:flex;align-items:center;gap:10px;background:#f5f7fc;border-radius:14px;padding:10px 12px
}
.match-rank .row.me{background:var(--accent-soft)}
.match-rank .no{width:28px;font-weight:900;color:var(--accent);flex:none}
.match-rank .sc{margin-left:auto;font-weight:900;color:var(--accent);flex:none}
@media (min-width:720px){
  .match-board{grid-template-columns:1fr 1fr 1fr}
}

/* ---------- 单元网格 ---------- */
.section-title{padding:6px 20px 4px;font-size:14px;color:var(--sub);font-weight:600}
.unit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;padding:12px 18px}
.unit-card{
  background:var(--card);border-radius:var(--radius);padding:16px 16px 14px;
  box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;transition:transform .12s;
  border-left:5px solid var(--accent);
}
.unit-card:active{transform:scale(.97)}
.unit-card .u-emoji{
  width:52px;height:52px;border-radius:14px;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:27px;background:var(--accent-soft)
}
.unit-card .u-no{font-size:12px;color:var(--sub);font-weight:700;letter-spacing:1px}
.unit-card .u-en{font-size:16.5px;font-weight:700;line-height:1.25}
.unit-card .u-cn{font-size:12.5px;color:var(--sub);margin-top:2px}
.unit-card .u-go{margin-left:auto;color:#b4bdcc;font-size:20px;flex:none}

/* ---------- 单元横幅 + 标签页 ---------- */
.unit-banner{margin:4px 18px 0;border-radius:22px;padding:20px 22px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 22px rgba(79,124,255,.28)}
.unit-banner .n{font-size:13px;opacity:.9;letter-spacing:2px;font-weight:700}
.unit-banner h3{font-size:24px;margin:4px 0 2px;font-weight:800}
.unit-banner p{font-size:14px;opacity:.92}
.tabs{display:flex;gap:8px;padding:16px 18px 4px;position:sticky;top:64px;z-index:40;background:linear-gradient(var(--bg) 82%,transparent)}
.tab{
  flex:1;padding:11px 4px;text-align:center;border-radius:13px;background:var(--card);
  box-shadow:var(--shadow);font-weight:700;font-size:15.5px;color:var(--sub)
}
.tab .t-emoji{display:block;font-size:20px;margin-bottom:2px}
.tab.on{background:var(--accent);color:#fff}
.tab:active{transform:scale(.96)}
.panel{padding:14px 18px 10px;display:none}
.panel.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- 单词卡片 ---------- */
.cmode{display:flex;background:#e7ebf4;border-radius:13px;padding:4px;margin:0 auto 14px;max-width:340px}
.cmode.story-switch{max-width:460px}
.cmode button{flex:1;padding:9px;border-radius:10px;font-size:15px;font-weight:700;color:var(--sub)}
.cmode button.on{background:#fff;color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.card-stage{perspective:1400px;max-width:460px;margin:0 auto}
.flash{position:relative;height:300px;transform-style:preserve-3d;transition:transform .5s}
.flick{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--card);border-radius:26px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:24px;text-align:center;
}
.face.back{transform:rotateY(180deg);background:linear-gradient(160deg,#ffffff,#eef3ff)}
.face .w-en{font-size:42px;font-weight:800;letter-spacing:.5px;word-break:break-word}
.face .w-ipa{font-size:18px;color:var(--accent);font-family:Georgia,serif}
.face .w-hint{position:absolute;bottom:14px;font-size:12.5px;color:#a3adbd}
.face .w-cn{font-size:34px;font-weight:800}
.face .w-cn small{display:block;font-size:15px;color:var(--sub);font-weight:400;margin-top:8px}
.speak-big{
  margin-top:6px;width:64px;height:64px;border-radius:50%;background:var(--accent);color:#fff;
  font-size:28px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 16px rgba(79,124,255,.4)
}
.speak-big:active{transform:scale(.92)}
.card-bar{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:18px}
.card-bar .navbtn{
  width:58px;height:58px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);
  font-size:22px;display:flex;align-items:center;justify-content:center
}
.card-bar .navbtn:active{transform:scale(.92)}
.card-bar .navbtn.main{width:66px;height:66px;background:var(--accent);color:#fff;font-size:28px}
.card-progress{text-align:center;color:var(--sub);font-size:14px;margin-top:12px;font-weight:600}
.star-btn{position:absolute;top:14px;right:16px;font-size:26px;color:#d7dce6;z-index:2}
.star-btn.on{color:var(--star)}

/* ---------- 词表 ---------- */
.wlist{display:flex;flex-direction:column;gap:10px;max-width:680px;margin:0 auto}
.wrow{
  display:flex;align-items:center;gap:12px;background:var(--card);border-radius:15px;
  padding:13px 16px;box-shadow:var(--shadow)
}
.wrow:active{background:#f7f9ff}
.wrow .txt{flex:1;min-width:0}
.wrow .en{font-size:19px;font-weight:700}
.wrow .ipa{font-size:13.5px;color:var(--accent);font-family:Georgia,serif;margin-left:8px}
.wrow .cn{font-size:14px;color:var(--sub);margin-top:1px}
.wrow .sp{width:42px;height:42px;border-radius:50%;background:var(--accent-soft);font-size:18px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--accent)}
.wrow .st{font-size:20px;color:#d7dce6;flex:none;width:26px;text-align:center}
.wrow .st.on{color:var(--star)}

/* ---------- 课文 ---------- */
.story-ctrl{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:14px;max-width:680px;margin-left:auto;margin-right:auto}
.btn{padding:10px 16px;border-radius:13px;background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:scale(.95)}
.btn.primary{background:var(--accent);color:#fff}
.btn.toggle.on{background:var(--accent-soft);color:var(--accent)}
.story-title{text-align:center;font-weight:800;font-size:17px;color:var(--sub);margin:2px 0 16px}
.sline{display:flex;gap:12px;max-width:680px;margin:0 auto 14px;cursor:pointer;align-items:flex-start}
.sline.narr{flex-direction:column;align-items:center;text-align:center}
.avatar{
  width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:18px;color:#fff;font-weight:800
}
.sline.narr .avatar{background:#b7c0d0;width:auto;height:auto;padding:2px 14px;border-radius:20px;font-size:12.5px;font-weight:700}
.sbubble{background:var(--card);border-radius:4px 16px 16px 16px;padding:12px 16px;box-shadow:var(--shadow);flex:1}
.sline.narr .sbubble{border-radius:16px;background:#f3f5fa;max-width:560px}
.sbubble .en{font-size:19px;line-height:1.55;font-weight:600}
.sbubble .zh{font-size:14px;color:var(--sub);margin-top:5px;display:none}
.show-zh .sbubble .zh{display:block}
.sline.reading .sbubble{outline:3px solid var(--accent);background:var(--accent-soft)}
.sline.reading.narr .sbubble{background:var(--accent-soft)}
.speaking-ico{font-size:14px;color:var(--accent);margin-left:4px;display:none}
.sline.reading .speaking-ico{display:inline}

/* ---------- 测验 ---------- */
.quiz-home{max-width:560px;margin:6px auto 0;text-align:center}
.quiz-home .q-emoji{font-size:48px}
.quiz-modes{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.qsec{display:flex;align-items:baseline;gap:8px;margin-top:26px;font-weight:800;font-size:16.5px}
.qsec small{font-weight:600;font-size:12px;color:var(--accent);background:var(--accent-soft);padding:2px 10px;border-radius:99px}
.qsec+.quiz-modes{margin-top:10px}
.qcard.phr .qprompt{font-size:22px;font-weight:700}
.qcard.sent .qprompt{font-size:19px;font-weight:700;line-height:1.55}
.qcard.sent .opt{font-size:15.5px;font-weight:500;padding:13px 15px}
.qcard.sent .opt .key{width:26px;height:26px;font-size:13px}
.qmode{
  background:var(--card);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:15px;text-align:left
}
.qmode:active{transform:scale(.98)}
.qmode .qe{font-size:32px;width:54px;height:54px;border-radius:14px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;flex:none}
.qmode b{font-size:18px}
.qmode small{display:block;color:var(--sub);font-size:13.5px;margin-top:2px}
.speak-switch{display:flex;justify-content:center;gap:8px;margin:2px 0 8px}
.speak-switch button{padding:7px 16px;border-radius:99px;background:#eef1f6;font-weight:800;font-size:14px;color:var(--sub)}
.speak-switch button.on{background:var(--accent);color:#fff}
.qmic{
  display:flex;align-items:center;justify-content:center;margin:16px auto 0;
  min-width:196px;padding:16px 24px;border-radius:999px;background:var(--accent);color:#fff;
  font-size:18px;font-weight:800;box-shadow:0 8px 18px rgba(79,124,255,.28)
}
.qmic.on{background:#ee5d6c}
.qmic:disabled{opacity:.55}
.qheard{text-align:center;min-height:22px;margin-top:12px;color:var(--sub);font-size:15px}
.qspeak-tip{text-align:center;color:var(--sub);font-size:13px;margin-top:8px}
.qcard{max-width:600px;margin:0 auto;background:var(--card);border-radius:22px;padding:26px 22px;box-shadow:var(--shadow)}
.qprog{height:8px;border-radius:5px;background:#e9edf5;overflow:hidden;margin-bottom:18px}
.qprog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:5px;transition:width .3s}
.qmeta{text-align:center;color:var(--sub);font-size:14px;margin-bottom:14px}
.qprompt{text-align:center;font-size:30px;font-weight:800;margin:6px 0 4px;word-break:break-word}
.qprompt-ipa{text-align:center;color:var(--accent);font-family:Georgia,serif;font-size:16px;margin-bottom:6px}
.qreplay{display:block;margin:0 auto 14px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;font-size:24px;box-shadow:0 6px 14px rgba(79,124,255,.35)}
.opts{display:flex;flex-direction:column;gap:11px;margin-top:8px}
.opt{
  background:#f5f7fc;border:2px solid transparent;border-radius:15px;padding:15px 18px;
  font-size:18px;font-weight:600;text-align:left;display:flex;align-items:center;gap:10px
}
.opt:active{background:#eaf0ff}
.opt .key{width:30px;height:30px;border-radius:9px;background:#fff;box-shadow:var(--shadow);font-size:15px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--sub)}
.opt.correct{background:var(--ok-soft);border-color:var(--ok);color:#177a4f}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:#c23b31}
.opt[disabled]{pointer-events:none;opacity:.85}
.opt.dim{opacity:.5}
.qfeedback{text-align:center;font-weight:800;font-size:17px;margin-top:14px;min-height:24px}
.qfeedback.ok{color:var(--ok)}
.qfeedback.bad{color:var(--bad)}
.qnext{display:block;margin:14px auto 0}
.qresult{text-align:center;padding:20px 10px}
.qresult .big-score{font-size:56px;font-weight:900;color:var(--accent)}
.qresult p{color:var(--sub);margin:4px 0 18px}
.qresult .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.qmodal-mask{position:fixed;inset:0;z-index:200;background:rgba(31,39,51,.45);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .18s}
.qmodal-mask.show{opacity:1;pointer-events:auto}
.qmodal{background:var(--card);border-radius:22px;padding:24px 22px;max-width:400px;width:100%;box-shadow:0 18px 50px rgba(31,39,51,.28);transform:scale(.9);transition:transform .18s;text-align:center}
.qmodal-mask.show .qmodal{transform:scale(1)}
.qmodal .qm-emoji{font-size:38px}
.qmodal h4{font-size:19px;margin:6px 0 4px}
.qmodal .qm-choice{background:var(--accent-soft);color:var(--accent);border-radius:14px;padding:12px 14px;font-weight:700;font-size:16px;word-break:break-word;margin:12px 0 18px;line-height:1.5}
.qmodal .qm-btns{display:flex;gap:12px}
.qmodal .qm-btns .btn{flex:1}
.hidden{display:none!important}

.fix-entry{
  display:flex;align-items:center;gap:14px;width:calc(100% - 36px);
  margin:12px 18px 0;padding:14px 18px;border-radius:22px;text-align:left;
  background:var(--card);box-shadow:var(--shadow)
}
.fix-entry:active{transform:scale(.98)}
.fix-entry .me-emoji{font-size:32px;line-height:1}
.fix-entry b{display:block;font-size:17px}
.fix-entry small{display:block;margin-top:2px;font-size:13px;color:var(--sub)}
.fix-wrap{padding:0 18px 28px}
.fix-note{margin:10px 0 0;font-size:13.5px;font-weight:700;color:var(--accent)}
.fix-sec{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px;margin-top:12px}
.fix-sec h3{font-size:15px;margin-bottom:6px}
.fix-sec p,.fix-help{color:var(--sub);font-size:13.5px;margin-bottom:10px}
.fix-actions{display:flex;flex-wrap:wrap;gap:8px}
.fix-en{font-size:22px;font-weight:800;word-break:break-word;line-height:1.35}
.fix-ipa{font-size:14px;color:var(--accent);font-family:Georgia,serif;margin-top:4px}
.fix-cn{color:var(--sub);margin-top:4px}
.fix-badge{font-size:12px;font-weight:800;color:#177a4f;background:var(--ok-soft);border-radius:99px;padding:3px 8px;flex:none}
.fix-badge.raw{color:var(--sub);background:#eef1f6}
.fix-url{
  width:100%;border:none;background:#f4f6fb;border-radius:12px;padding:10px 12px;font-size:15px
}
audio.fix-audio{width:100%;margin:8px 0 10px;display:block}
.fix-hit{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #eef1f6}
.fix-hit .name{flex:1;min-width:0;font-size:13px;font-weight:700;word-break:break-word}
.fix-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.fix-links a{font-size:13.5px;font-weight:800;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:6px 10px;text-decoration:none}
.fix-mic-on{background:var(--bad)!important;color:#fff!important}
.fix-list .en{font-size:16px;word-break:break-word}
.fix-list .txt{text-align:left}

.user-chip{
  flex:none;max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  padding:8px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);
  font-weight:800;font-size:14px
}
.user-chip:active{transform:scale(.96)}
.user-wrap{padding:4px 18px 28px}
.user-card{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px;margin-top:10px
}
.user-card:active{transform:scale(.99)}
.user-ava{
  width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:900;font-size:22px;flex:none
}
.user-card .who{flex:1;min-width:0}
.user-card b{display:block;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-card small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.user-ops{display:flex;flex-wrap:wrap;gap:6px;flex:none}
.user-add{display:flex;gap:8px;margin-top:14px}
.user-add input,.user-rename{
  flex:1;min-width:0;border:none;border-radius:14px;padding:12px 14px;font-size:16px;
  background:var(--card);box-shadow:var(--shadow);color:var(--ink)
}
.idle-banner{
  margin:0 0 12px;padding:12px 14px;border-radius:16px;background:var(--bad-soft);
  color:#b42318;font-weight:800;font-size:15px;line-height:1.45
}
.user-note{margin-top:8px;color:var(--bad);font-weight:700;font-size:13.5px}

@media (max-width:560px){
  .book-grid{grid-template-columns:1fr}
  .book-card{min-height:150px}
  .face .w-en{font-size:34px}
  .face .w-cn{font-size:28px}
  .tabs{top:60px}
}
</style>

const STUDY_IDLE_MS=5*60*1000;

let studyAnchor=0, lastActivity=Date.now(), studyTimer=null;

function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function todayKey(){return dateKey(new Date())}
function saveStudyTime(){if(currentUser)localStorage.setItem('yl4_time_'+currentUser.id,JSON.stringify(studyTime))}
function fmtDur(sec){
  sec=Math.max(0,sec|0);
  const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  if(h)return h+'小时'+m+'分'+s+'秒';
  if(m)return m+'分'+s+'秒';
  return s+'秒';
}
function dayLabel(key){
  if(key===todayKey())return '今天';
  const y=new Date();y.setHours(0,0,0,0);y.setDate(y.getDate()-1);
  if(key===dateKey(y))return '昨天';
  const d=new Date(key+'T00:00:00');
  const prefix=d.getFullYear()===new Date().getFullYear()?'':d.getFullYear()+'年';
  return prefix+(d.getMonth()+1)+'月'+d.getDate()+'日';
}
function mediaPlaying(){
  if(autoReading)return true;
  if(audioEl&&!audioEl.paused)return true;
  try{if(speechSynthesis.speaking)return true}catch(e){}
  return false;
}
function studyActive(){
  if(!currentUser||document.hidden)return false;
  if(mediaPlaying())return true;
  return Date.now()-lastActivity<STUDY_IDLE_MS;
}
function flushStudy(){
  if(!studyAnchor)return;
  const now=Date.now();
  const add=Math.floor((now-studyAnchor)/1000);
  if(add<=0)return;
  if(add>30){studyAnchor=now;return}
  const k=todayKey();
  studyTime.days[k]=(studyTime.days[k]||0)+add;
  studyAnchor+=add*1000;
  saveStudyTime();
}
function studySnapshot(){
  const days=Object.assign({},studyTime.days||{});
  if(studyAnchor){
    const extra=Math.floor((Date.now()-studyAnchor)/1000);
    if(extra>0&&extra<=30){
      const k=todayKey();
      days[k]=(days[k]||0)+extra;
    }
  }
  return days;
}
function paintStudy(){
  const todayEl=document.getElementById('study-today');
  if(!todayEl)return;
  const days=studySnapshot();
  const today=todayKey();
  const keys=Object.keys(days).filter(k=>days[k]>0).sort().reverse();
  const total=keys.reduce((n,k)=>n+(days[k]|0),0);
  todayEl.textContent=fmtDur(days[today]||0);
  document.getElementById('study-total').textContent=fmtDur(total);
  document.getElementById('study-daycount').textContent='共 '+keys.length+' 天';
  const live=document.getElementById('study-live');
  const on=!!studyAnchor;
  live.textContent=on?'计时中':'已暂停';
  live.classList.toggle('on',on);
  const list=document.getElementById('study-list');
  const sig=keys.join(',');
  if(list.dataset.keys!==sig){
    list.dataset.keys=sig;
    list.innerHTML=keys.length?keys.map(k=>`
      <div class="study-row${k===today?' today':''}">
        <span class="d">${dayLabel(k)}</span>
        <span class="t" id="sd-${k}">${fmtDur(days[k])}</span>
      </div>`).join(''):'<div class="study-empty">还没有学习记录。打开页面就会开始计时。</div>';
  }else{
    keys.forEach(k=>{const el=document.getElementById('sd-'+k);if(el)el.textContent=fmtDur(days[k])});
  }
}
function tickStudy(){
  if(currentUser&&Date.now()-lastActivity>=STUDY_IDLE_MS){idleLogout();return}
  if(studyActive()){
    if(!studyAnchor)studyAnchor=Date.now();
    flushStudy();
  }else if(studyAnchor){
    flushStudy();
    studyAnchor=0;
  }
  paintStudy();
}
function noteActivity(){

let voices=[];
function loadVoices(){voices=speechSynthesis.getVoices()}
loadVoices();
if('onvoiceschanged' in speechSynthesis) speechSynthesis.onvoiceschanged=loadVoices;
function pickVoice(){
  const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
  if(!vs.length)return null;
  const pref=vs.find(v=>/en-US/i.test(v.lang)&&/female|samantha|zira|aria|jenny/i.test(v.name))
          ||vs.find(v=>/en-US/i.test(v.lang))||vs.find(v=>/en-GB/i.test(v.lang))||vs[0];
  return pref;
}
let speakingLineIdx=-1, autoTimer=null, autoReading=false, audioEl=null;
let fixUrls=new Map(), fixMeta=new Map();
function audioKey(t){let h=2166136261;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h.toString(16).padStart(8,'0')}
function stopAudioEl(){if(audioEl){audioEl.onended=audioEl.onerror=null;audioEl.pause();audioEl=null}}
function pauseFixPlayers(){document.querySelectorAll('audio.fix-audio').forEach(a=>a.pause())}
function playAudioSrc(src,opts,onfail){
  const a=new Audio(src);
  a.playbackRate=Math.min(1.6,Math.max(0.5,opts.rate||settings.rate));
  if('preservesPitch' in a)a.preservesPitch=true;
  audioEl=a;let fell=false;
  const fallback=()=>{if(fell)return;fell=true;if(audioEl===a)audioEl=null;onfail()};
  a.onended=()=>{opts.onend&&opts.onend()};
  a.onerror=fallback;
  const p=a.play();
  if(p&&p.catch)p.catch(fallback);
}
function speak(text,opts){
  opts=opts||{};
  speechSynthesis.cancel();stopAudioEl();pauseFixPlayers();
  const file='audio/'+audioKey(text)+'.mp3';
  const over=fixUrls.get(audioKey(text));
  const playFile=()=>playAudioSrc(file,opts,()=>ttsSpeak(text,opts));
  try{
    if(over)playAudioSrc(over,opts,playFile);
    else playFile();
  }catch(e){ttsSpeak(text,opts)}
}
function ttsSpeak(text,opts){
  try{
    const u=new SpeechSynthesisUtterance(text.replace(/[“”]/g,''));
    u.lang='en-US'; u.rate=opts.rate||settings.rate;
    const v=pickVoice(); if(v)u.voice=v;
    u.onend=()=>{opts.onend&&opts.onend()};
    u.onerror=()=>{opts.onend&&opts.onend()};
    speechSynthesis.speak(u);
    speechSynthesis.resume&&speechSynthesis.resume();
  }catch(e){opts.onend&&opts.onend()}
}
function stopSpeak(){autoReading=false;speakingLineIdx=-1;clearTimeout(autoTimer);stopAudioEl();speechSynthesis.cancel();document.querySelectorAll('.sline.reading').forEach(el=>el.classList.remove('reading'))}

/* ================= 语音保存到本机 ================= */
const AUDIO_CACHE='yl4-v15';
const AUDIO_BATCH=6;
let audioSync={done:0,total:0,miss:0,running:false,offline:false,full:false};
let audioSyncGen=0;
let audioBeat=0;
function audioSyncHtml(){
  return `<div class="audio-sync" id="audio-sync">
    <p id="audio-sync-text">正在准备语音…</p>
    <div class="audio-sync-bar"><span id="audio-sync-fill"></span></div>
    <button class="btn" id="audio-sync-retry" hidden type="button" onclick="startAudioSync()">继续下载</button>
  </div>`;
}
function paintAudioProgress(){
  const text=document.getElementById('audio-sync-text');
  const fill=document.getElementById('audio-sync-fill');
  const retry=document.getElementById('audio-sync-retry');
  if(!text)return;
  const total=audioSync.total;
  const done=total?Math.min(audioSync.done,total):0;
  if(fill)fill.style.width=(total?Math.round(done/total*100):0)+'%';
  let msg='正在准备语音…';
  let showRetry=false;
  if(!('caches' in window))msg='这台浏览器不能把语音保存到本机。';
  else if(audioSync.full)msg='手机存储不够，已保存 '+done+' / '+total+'。';
  else if(total&&done>=total)msg='语音已保存到本机 '+done+' / '+total;
  else if(total&&audioSync.offline){msg='语音已保存 '+done+' / '+total+'。联网后会继续下载。';showRetry=true}
  else if(total&&!audioSync.running&&audioSync.miss){msg='语音已保存 '+done+' / '+total+'，还有 '+audioSync.miss+' 个没下完。';showRetry=true}
  else if(total)msg='正在保存语音到本机 '+done+' / '+total;
  text.textContent=msg;
  if(retry)retry.hidden=!showRetry;
}
async function startAudioSync(){
  if(audioSync.running)return;
  if(!('caches' in window)||typeof AUDIO_FILES==='undefined'){paintAudioProgress();return}
  const gen=++audioSyncGen;
  audioSync.running=true;
  audioSync.offline=false;
  audioSync.full=false;
  audioSync.miss=0;
  audioBeat=Date.now();
  const files=AUDIO_FILES;
  audioSync.total=files.length;
  paintAudioProgress();
  let cache;
  try{cache=await caches.open(AUDIO_CACHE)}
  catch(e){audioSync.running=false;paintAudioProgress();return}
  if(gen!==audioSyncGen)return;
  const have=new Set();
  try{
    (await cache.keys()).forEach(req=>{
      const i=req.url.lastIndexOf('audio/');
      if(i>=0)have.add(req.url.slice(i).split('?')[0]);
    });
  }catch(e){}
  const missing=files.filter(f=>!have.has(f));
  audioSync.done=files.length-missing.length;
  paintAudioProgress();
  if(!navigator.onLine){
    audioSync.offline=true;
    audioSync.miss=missing.length;
    audioSync.running=false;
    paintAudioProgress();
    return;
  }
  let cursor=0;
  let stop=false;
  async function worker(){
    while(!stop&&gen===audioSyncGen){
      const i=cursor++;
      if(i>=missing.length)return;
      try{
        const resp=await fetch(missing[i]);
        if(!resp.ok)continue;
        await cache.put(missing[i],resp);
        audioSync.done++;
        audioBeat=Date.now();
        paintAudioProgress();
      }catch(e){
        if(e&&(e.name==='QuotaExceededError'||e.code===22)){audioSync.full=true;stop=true}
      }
    }
  }
  await Promise.all(Array.from({length:AUDIO_BATCH},()=>worker()));
  if(gen!==audioSyncGen)return;
  let left=0;
  for(const f of missing){
    try{if(!(await cache.match(f)))left++}catch(e){left++}
  }
  audioSync.done=files.length-left;
  audioSync.miss=left;
  audioSync.offline=!navigator.onLine&&left>0;
  audioSync.running=false;
  paintAudioProgress();
}
function bootAudio(){
  window.addEventListener('online',()=>{audioSync.running=false;startAudioSync()});
  if(!('serviceWorker' in navigator)){startAudioSync();return}
  let started=false;
  const once=()=>{if(started)return;started=true;startAudioSync()};
  navigator.serviceWorker.ready.then(once).catch(once);
  setTimeout(once,4000);
}

  }

function speakLine(u,i){
  const gen=++utterGen;
  highlightLine(i);
  speak(currentScript(u).lines[i][1],{onend:()=>{
    if(gen!==utterGen)return; // 已被新操作取代（如切换语速重读）
    if(speakingLineIdx===i&&!autoReading){document.getElementById('sline-'+i)?.classList.remove('reading');speakingLineIdx=-1}
    if(autoReading)autoTimer=setTimeout(()=>readStory(u,i+1),350)
  }});

function readStory(u,i){
  if(!autoReading)return;
  if(i>=currentScript(u).lines.length){stopSpeak();stopAuto();return}
  speakLine(u,i);
}

function quizPool(u,k){
  let p;
  if(k==='phrase')p=u.phrases.map(x=>({en:x[0],zh:x[1]}));
  else if(k==='sent'){
    const lines=(u.story?u.story.lines:[]).concat(u.cartoon?u.cartoon.lines:[]);
    p=lines.map(x=>({en:x[1],zh:x[2],who:x[0]}));
  }
  else p=u.words.map(x=>({en:x[0],zh:x[2],ipa:x[1]}));
  const seen=new Set();
  return p.filter(x=>!seen.has(x.en)&&seen.add(x.en));
}

function drawQuiz(){

  if(q.mode==='listen')setTimeout(()=>speak(item.en),250);

function replayQ(){const q=quizState;if(q)speak(q.qs[q.idx].it.en)}
function normSpeak(s){
  let t=String(s||'').toLowerCase().replace(/[’‘]/g,"'");
  [['what\'s','what is'],['where\'s','where is'],['who\'s','who is'],['that\'s','that is'],['it\'s','it is'],['he\'s','he is'],['she\'s','she is'],['let\'s','let us'],['i\'m','i am'],['don\'t','do not'],['can\'t','can not'],['won\'t','will not'],['isn\'t','is not'],['aren\'t','are not']].forEach(pair=>{t=t.split(pair[0]).join(pair[1])});
  t=t.replace(/n't/g,' not').replace(/'re/g,' are').replace(/'ve/g,' have').replace(/'ll/g,' will').replace(/'/g,'');
  return t.replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
}
function speakHit(heard,target){
  const h=normSpeak(heard),t=normSpeak(target);
  if(!h||!t)return false;
  if(h===t)return true;
  const tw=t.split(' ').filter(Boolean),hw=h.split(' ').filter(Boolean);
  const same=(a,b)=>a===b||a===b+'s'||b===a+'s';
  if(tw.length===1)return hw.some(w=>same(w,tw[0]));
  let i=0;
  hw.forEach(w=>{if(i<tw.length&&same(w,tw[i]))i++});
  return i===tw.length;
}
let quizRec=null;
function stopQuizMic(){
  const rec=quizRec;
  quizRec=null;
  if(!rec)return;
  rec.onresult=rec.onerror=rec.onend=null;
  try{rec.stop()}catch(e){}
}
function setQuizPrompt(p){
  const q=quizState;
  if(!q||q.locked||q.mode!=='speak'||q.prompt===p)return;
  q.prompt=p;
  drawQuiz();
}
function toggleQuizMic(){
  const q=quizState;
  if(!q||q.locked||q.mode!=='speak')return;
  if(quizRec){try{quizRec.stop()}catch(e){}return}
  const Rec=window.SpeechRecognition||window.webkitSpeechRecognition;
  const heardEl=document.getElementById('qheard');
  if(!Rec){if(heardEl)heardEl.textContent='这个浏览器不能识别读音，请用手机上的 Chrome。';return}
  const rec=new Rec();
  quizRec=rec;
  rec.lang='en-US';
  rec.interimResults=true;
  rec.maxAlternatives=5;
  rec.continuous=false;
  const btn=document.getElementById('qmic');
  if(btn){btn.classList.add('on');btn.textContent='正在听… 点一下结束'}
  if(heardEl)heardEl.textContent='请读出英文';
  const finals=[];
  let interim='';
  let failed=false;
  rec.onresult=e=>{
    for(let i=e.resultIndex;i<e.results.length;i++){
      const alts=[...Array(e.results[i].length)].map((_,n)=>e.results[i][n].transcript);
      if(e.results[i].isFinal)finals.push(alts);
      else interim=alts[0]||'';
    }
    const show=finals.length?finals[finals.length-1][0]:interim;
    const el=document.getElementById('qheard');
    if(el&&show)el.textContent='听到：'+show;
  };
  rec.onerror=ev=>{
    if(!ev||ev.error==='aborted'||quizRec!==rec)return;
    failed=true;
    const el=document.getElementById('qheard');
    if(!el)return;
    if(ev.error==='not-allowed')el.textContent='请允许使用麦克风后再试。';
    else if(ev.error==='network')el.textContent='读音识别需要联网，请打开网络后再试。';
    else el.textContent='没听清，再点麦克风说一次。';
  };
  rec.onend=()=>{
    if(quizRec!==rec)return;
    quizRec=null;
    const b=document.getElementById('qmic');
    if(b){b.classList.remove('on');b.textContent='🎤 再试一次'}
    if(q.locked||failed)return;
    const cands=finals.length?finals.flat():(interim?[interim]:[]);
    if(!cands.length){
      const el=document.getElementById('qheard');
      if(el)el.textContent='没听清，再点麦克风说一次。';
      return;
    }
    const idx=q.idx;
    gradeSpeak(cands.some(c=>speakHit(c,q.qs[idx].it.en)),cands[0]);
  };
  try{rec.start()}catch(e){quizRec=null;if(heardEl)heardEl.textContent='麦克风暂时打不开，请再试一次。'}
}
function gradeSpeak(correct,heard){
  const q=quizState;if(!q||q.locked)return;q.locked=true;
  stopQuizMic();
  if(correct)q.score++;
  const cur=q.qs[q.idx];cur.ans=correct;
  if(q.kind==='word'&&!correct){stars[wordKey(q.bid,q.u.n,[cur.it.en])]=true;saveStars()}
  const mic=document.getElementById('qmic');
  if(mic)mic.disabled=true;
  const fb=document.getElementById('qfeedback');
  fb.className='qfeedback '+(correct?'ok':'bad');
  fb.innerHTML=correct?'✅ 读对了！':`❌ 听到：${esc(heard||'')}　正确读法：<b>${esc(cur.it.en)}</b>`;
  const idx=q.idx;
  speak(correct?'Good job':'Oh no',{rate:1,onend:()=>{if(!correct&&quizState===q&&q.idx===idx)speak(cur.it.en)}});
  const nb=document.getElementById('qnext');nb.classList.remove('hidden');
  nb.textContent=q.idx+1>=q.qs.length?'查看成绩 🏁':'下一题 ›';
}

function cancelPick(){

function confirmPick(){

function answerQuiz(btn){
  const q=quizState;if(q.locked)return;q.locked=true;
  const correct=btn.dataset.c==='1';
  document.querySelectorAll('.opt').forEach(o=>{
    o.setAttribute('disabled','');
    if(o.dataset.c==='1')o.classList.add('correct');
    else o.classList.add('dim');
  });
  if(!correct){btn.classList.remove('dim');btn.classList.add('wrong')}
  if(correct)q.score++;
  const cur=q.qs[q.idx];cur.ans=correct;
  // 单词题：答错加入重点（实心黄星）；词组/句子不标星
  if(q.kind==='word'&&!correct){stars[wordKey(q.bid,q.u.n,[cur.it.en])]=true;saveStars()}

function matchSec(){

function matchScopeLabel(){

  DATA.books.forEach(b=>{
    const nums=matchCfg.units.filter(id=>id.startsWith(b.id+'-')).map(id=>+id.split('-')[1]).sort((a,c)=>a-c);
    if(!nums.length)return;
    const cnNum=['','一','二','三','四','五','六'][b.grade]||'';
    const short=cnNum+(b.id.endsWith('b')?'下':'上');
    parts.push(nums.length===b.units.length?b.name:short+' '+nums.map(n=>'U'+n).join('、'));
  });
  const kind=matchCfg.words&&matchCfg.phrases?'单词+词组':matchCfg.words?'单词':'词组';
  return (parts.join(' · ')||'未选择')+' · '+kind;

function matchPairs(){
  const seen=new Set(),out=[];
  matchCfg.units.forEach(id=>{
    const sp=id.split('-'),b=getBook(sp[0]);if(!b)return;
    const u=b.units.find(x=>x.n===+sp[1]);if(!u)return;
    const push=(en,zh)=>{
      en=String(en||'').trim();zh=String(zh||'').trim();
      if(!en||!zh)return;
      const key=en.toLowerCase()+'|'+zh;
      if(seen.has(key))return;
      seen.add(key);
      out.push({en,zh});
    };
    if(matchCfg.words)u.words.forEach(w=>push(w[0],w[2]));
    if(matchCfg.phrases)u.phrases.forEach(p=>push(p[0],p[1]));
  });

}

function takeMatchBatch(){

    matchPool.forEach((p,i)=>p.id=i);
    matchCursor=0;

function matchTick(){

  const left=matchDeadline-Date.now();

function tapMatch(uid){
  if(!matchRunning||matchLock)return;
  const tile=matchBoard.find(t=>t.uid===uid);
  if(!tile||tile.gone)return;
  const tiles=[...document.querySelectorAll('.match-tile')];
  const elOf=id=>tiles.find(el=>el.dataset.uid===id);
  if(matchSel===uid){matchSel=null;tiles.forEach(el=>el.classList.remove('on'));return}
  if(!matchSel){matchSel=uid;elOf(uid)?.classList.add('on');return}
  const prev=matchBoard.find(t=>t.uid===matchSel);
  const prevEl=elOf(prev.uid),curEl=elOf(tile.uid);
  if(prev.pair===tile.pair&&prev.side!==tile.side){
    prev.gone=true;tile.gone=true;matchSel=null;matchScore++;
    prevEl?.classList.remove('on');prevEl?.classList.add('gone');
    curEl?.classList.add('gone');
    paintMatchScore();
    speak(tile.en);
    if(matchBoard.every(t=>t.gone)){
      matchLock=true;
      setTimeout(()=>{matchLock=false;if(matchRunning)dealMatchPage()},450);
    }
    return;
  }
  matchLock=true;
  prevEl?.classList.add('bad');curEl?.classList.add('bad');
  setTimeout(()=>{

    prevEl?.classList.remove('on','bad');curEl?.classList.remove('bad');

function fixDb(){

function fixTx(store,mode,run){

function audioBufferToWav(buffer){
  const ch0=buffer.getChannelData(0);
  const ch1=buffer.numberOfChannels>1?buffer.getChannelData(1):null;
  const samples=new Int16Array(ch0.length);
  for(let i=0;i<ch0.length;i++){
    let s=ch1?(ch0[i]+ch1[i])/2:ch0[i];
    s=Math.max(-1,Math.min(1,s));
    samples[i]=s<0?s*0x8000:s*0x7fff;
  }
  const dataSize=samples.length*2;
  const buf=new ArrayBuffer(44+dataSize);
  const v=new DataView(buf);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  ws(0,'RIFF');v.setUint32(4,36+dataSize,true);ws(8,'WAVE');ws(12,'fmt ');
  v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,buffer.sampleRate,true);v.setUint32(28,buffer.sampleRate*2,true);
  v.setUint16(32,2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,dataSize,true);
  for(let i=0;i<samples.length;i++)v.setInt16(44+i*2,samples[i],true);
  return new Blob([buf],{type:'audio/wav'});
}
async function blobToWav(blob){
  const Ctx=window.AudioContext||window.webkitAudioContext;
  const ctx=new Ctx();
  try{
    const raw=await blob.arrayBuffer();
    const audio=await ctx.decodeAudioData(raw.slice(0));
    return audioBufferToWav(audio);
  }finally{ctx.close()}
}

async function toggleFixMic(){
  if(fixMic){stopFixMic();return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||typeof MediaRecorder==='undefined'){
    fixNote='这台设备不能直接录音，请改用导入文件。';
    rerenderFix();return;
  }
  stopSpeak();
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mime=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':'';
    const rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);
    const chunks=[];
    const m={rec,stream,t0:Date.now(),timer:null,abandoned:false,stopping:false};
    rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    rec.onstop=async()=>{
      try{stream.getTracks().forEach(t=>t.stop())}catch(e){}
      if(m.abandoned||hashParts()[0]!=='fix')return;
      fixMic=null;
      const raw=new Blob(chunks,{type:rec.mimeType||'audio/webm'});
      let blob=raw;
      try{blob=await blobToWav(raw)}catch(e){}
      setFixDraft(blob,'刚才的录音');
      fixNote='录音完成。试听一下，合适就保存。';
      rerenderFix();
    };
    fixMic=m;
    rec.start(200);
    rerenderFix();
    m.timer=setInterval(()=>{
      if(!fixMic)return;
      const sec=Math.min(30,Math.floor((Date.now()-m.t0)/1000));
      const el=document.getElementById('fix-mic-time');
      if(el)el.textContent=sec+' 秒';
      if(sec>=30)stopFixMic();
    },200);
  }catch(e){
    fixNote='没有拿到麦克风权限。请在浏览器里允许使用麦克风后再试。';
    rerenderFix();
  }
}
function stopFixMic(){

  clearInterval(m.timer);
  const el=document.getElementById('fix-mic-btn');

  try{if(m.rec.state==='recording')m.rec.stop()}catch(e){}

async function searchFixWeb(){
  const it=fixCurrent();if(!it)return;
  const gen=++fixSearchGen;
  const word=it.en.trim();
  fixNote='正在搜索可下载的发音…';
  fixHits=[];
  const p0=hashParts();renderFix(p0[1],p0[2],p0[3]);
  const hits=[];
  const seen=new Set();
  const add=h=>{if(!h||!h.url||seen.has(h.url))return;seen.add(h.url);hits.push(h)};
  try{
    if(/^[A-Za-z][A-Za-z'’-]*$/.test(word)){
      const token=word.toLowerCase();
      const titles=['En-us-','En-uk-','En-gb-'].flatMap(pre=>[pre+token+'.ogg',pre+token+'.mp3']).map(t=>'File:'+t);
      const data=await fetch('https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&prop=imageinfo&iiprop=url|mime&titles='+encodeURIComponent(titles.join('|'))).then(r=>r.json());
      commonsHits(data).forEach(add);
      const dict=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(token));
      if(dict.ok){
        const arr=await dict.json();
        ((arr[0]&&arr[0].phonetics)||[]).forEach(ph=>{
          if(ph.audio)add({name:'词典 '+(ph.audio.split('/').pop()||token),url:ph.audio});
        });
      }
    }
    const search=await fetch('https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&list=search&srnamespace=6&srlimit=8&srsearch='+encodeURIComponent(word+' English pronunciation')).then(r=>r.json());
    const titles=((search.query&&search.query.search)||[]).map(s=>s.title).filter(t=>/\.(ogg|oga|mp3|wav|flac|opus)$/i.test(t)).slice(0,6);
    if(titles.length){
      const data=await fetch('https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&prop=imageinfo&iiprop=url|mime&titles='+encodeURIComponent(titles.join('|'))).then(r=>r.json());
      commonsHits(data).forEach(add);
    }
  }catch(e){}
  if(gen!==fixSearchGen)return;
  fixHits=hits.slice(0,8);
  fixNote=fixHits.length?'找到这些可下载的发音，试听后点保存。':'没有找到可直接下载的发音。可以试听上面的有道读音，或打开词典页面下载后再导入。';
  rerenderFix();
}
function isAudioHit(mime,title){
  if(/\.(ogg|oga|mp3|wav|flac|opus|m4a|aac)$/i.test(title||''))return true;
  if(!mime)return false;
  return mime.indexOf('audio/')===0||mime==='application/ogg';
}
function commonsHits(data){
  const pages=(data&&data.query&&data.query.pages)||{};
  const hits=[];
  Object.keys(pages).forEach(id=>{
    const p=pages[id];
    const info=p.imageinfo&&p.imageinfo[0];
    if(!info||!info.url)return;
    const name=(p.title||'发音').replace(/^File:/,'');
    if(!isAudioHit(info.mime,name))return;
    hits.push({name,url:info.url});
  });
  return hits;
}

  if(legacy)localStorage.setItem('yl4_time_'+u.id,JSON.stringify(legacy));
  userNote='';
  if(!currentUser)loginUser(u.id);
  else redrawUsers();
}
function startRename(id){userEditId=id;userDelId='';userNote='';redrawUsers()}
function saveRename(id){
  const input=document.getElementById('rename-'+id);
  const got=cleanUserName(input&&input.value);
  if(got.err){userNote=got.err;redrawUsers();return}
  if(users.some(u=>u.id!==id&&u.name===got.name)){userNote='已经有这个名字了';redrawUsers();return}
  const u=users.find(x=>x.id===id);
  if(u)u.name=got.name;
  if(currentUser&&currentUser.id===id)currentUser=u;
  saveUserList();
  userEditId='';userNote='';
  redrawUsers();
}
function askDelUser(id){userDelId=id;userEditId='';userNote='';redrawUsers()}
function confirmDelUser(id){
  flushStudy();
  users=users.filter(u=>u.id!==id);
  saveUserList();
  localStorage.removeItem('yl4_time_'+id);
  userDelId='';
  if(currentUser&&currentUser.id===id){
    studyAnchor=0;
    sessionStorage.removeItem('yl4_uid');
    currentUser=null;
    studyTime={days:{}};
    renderLogin();
    return;
  }
  redrawUsers();
}
function redrawUsers(){
  if(currentUser)renderUsers();
  else renderLogin();
}
function renderLogin(banner){renderUserScreen(true,banner||(idleBounced?IDLE_PROMPT:''))}
function renderUsers(){renderUserScreen(false,'')}
function renderUserScreen(gate,banner){
  const editing=userManage||!gate;
  $app.innerHTML=`
    <div class="topbar">
      ${gate?'':'<button class="icon-btn" onclick="go(\'/home\')">‹</button>'}
      <h1>${gate?'请选择谁来学习':'用户管理'}<small>${gate?'点一个名字进入，学习时长分开记录':'可以添加、改名或切换学习者'}</small></h1>
      ${gate?'':userChip()}
    </div>
    <div class="user-wrap">
      ${banner?`<div class="idle-banner">${esc(banner)}</div>`:''}
      ${gate?`<p class="fix-help">5 分钟没有点击或按键，会自动退出，并提醒重新登录。</p>`:''}
      ${users.map(u=>`
        <div class="user-card">
          <span class="user-ava" style="background:${userColor(u.name)}">${esc(u.name.slice(0,1))}</span>
          <span class="who">
            ${userEditId===u.id
              ?`<input class="user-rename" id="rename-${u.id}" maxlength="12" value="${esc(u.name)}">`
              :`<b>${esc(u.name)}</b><small>今日 ${fmtDur(userToday(u.id))}</small>`}
          </span>
          <span class="user-ops">
            ${userEditId===u.id
              ?`<button class="btn primary" onclick="saveRename('${u.id}')">保存</button>`
              :`<button class="btn primary" onclick="loginUser('${u.id}')">${currentUser&&currentUser.id===u.id?'学习中':'进入'}</button>`}
            ${editing&&userEditId!==u.id?`<button class="btn" onclick="startRename('${u.id}')">改名</button>`:''}
            ${editing&&userDelId!==u.id?`<button class="btn" onclick="askDelUser('${u.id}')">删除</button>`:''}
            ${userDelId===u.id?`<button class="btn" style="background:var(--bad);color:#fff" onclick="confirmDelUser('${u.id}')">确认删除</button>`:''}
          </span>
        </div>`).join('')||'<p class="fix-help">还没有学习者。先在下面添加一个名字。</p>'}
      <div class="user-add">
        <input id="user-name" maxlength="12" placeholder="输入名字，例如小明" onkeydown="if(event.key==='Enter')addUserFromInput()">
        <button class="btn primary" onclick="addUserFromInput()">添加</button>
      </div>
      ${userNote?`<p class="user-note">${esc(userNote)}</p>`:''}
      <div class="fix-actions" style="margin-top:14px">
        ${gate?`<button class="btn" onclick="userManage=!userManage;renderLogin()">${userManage?'完成管理':'管理用户'}</button>`:''}
        ${currentUser?`<button class="btn" onclick="logoutUser()">退出登录</button>`:''}
      </div>
    </div>`;
  const ren=userEditId&&document.getElementById('rename-'+userEditId);
  if(ren){ren.focus();ren.select()}
}

/* ================= 启动 ================= */
loadUserList();
loadCurrentUser();
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,noteActivity,{passive:true}));
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){freezeMatchClock();flushStudy();studyAnchor=0}
  else{
    resumeMatchClock();
    if(audioSync.running&&Date.now()-audioBeat>8000)audioSync.running=false;
    if(!(audioSync.total&&audioSync.done>=audioSync.total&&!audioSync.miss))startAudioSync();
  }
  tickStudy();
});
window.addEventListener('pagehide',()=>{flushStudy();studyAnchor=0});
studyTimer=setInterval(tickStudy,1000);
loadFixAudio().catch(()=>{}).then(()=>{
  if(!location.hash)location.hash='#/home';else route();
  tickStudy();
  bootAudio();
});
</script>
<script>
if('serviceWorker' in navigator){
  let swRefreshing=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(swRefreshing)return;
    swRefreshing=true;
    location.reload();
  });
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.log('SW reg fail',e)));
}
</script>
</body>
</html>
